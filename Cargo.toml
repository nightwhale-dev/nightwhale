[package]
name = "nightwhale"
version = "0.1.0"
edition = "2021"
description = "An idea exchange for the DeepSeek Harness (dsh) ecosystem — search, buy, decompose, and personalize community ideas."
license = "MIT"
repository = "https://github.com/nightwhale-dev/nightwhale"
keywords = ["deepseek", "dsh", "agent", "plugin", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "nightwhale"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
dirs = "5"
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
